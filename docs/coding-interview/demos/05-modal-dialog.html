<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessible modal dialog</title>
<style>
  :root { font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 24px; }
  dialog { border: 0; border-radius: 16px; padding: 24px; width: min(420px, calc(100% - 32px)); box-shadow: 0 20px 60px rgb(0 0 0 / .3); }
  dialog::backdrop { background: rgb(15 23 42 / .6); backdrop-filter: blur(2px); }
  dialog[open] { animation: pop .15s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  button { padding: 8px 14px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; font: inherit; }
  button.primary { background: #4f46e5; color: white; border-color: #4f46e5; }
</style>
</head>
<body>
  <button id="open" type="button">Delete account…</button>
  <p id="result" aria-live="polite"></p>

  <!-- <dialog> + showModal(): focus moves inside, the rest of the page is inert, Esc closes, top layer (no z-index wars) -->
  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
    <form method="dialog">
      <h2 id="confirm-title">Delete account?</h2>
      <p id="confirm-desc">This permanently removes your data.</p>
      <label>Type DELETE to confirm <input name="confirm" autocomplete="off" autofocus></label>
      <div class="actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="delete" class="primary">Delete</button>
      </div>
    </form>
  </dialog>

  <script>
    const dialog = document.getElementById("confirm");
    const opener = document.getElementById("open");
    opener.addEventListener("click", () => dialog.showModal());
    // Click on the backdrop (the dialog element itself, outside the form) closes it
    dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close("cancel"); });
    dialog.addEventListener("close", () => {
      const ok = dialog.returnValue === "delete" && dialog.querySelector("input").value === "DELETE";
      document.getElementById("result").textContent = ok ? "Account deleted" : "Cancelled";
      dialog.querySelector("form").reset();
      opener.focus();                                   // return focus to what opened it
    });
  </script>
</body>
</html>
