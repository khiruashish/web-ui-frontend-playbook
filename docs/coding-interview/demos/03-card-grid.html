<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive card grid</title>
<style>
  :root { font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; }
  .cards {
    display: grid;
    /* As many 260px+ columns as fit; never wider than the container (min() avoids overflow on tiny screens) */
    grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
    gap: 16px;
  }
  .card {
    display: grid;
    grid-template-rows: auto auto 1fr auto;      /* image, title, text grows, button stays at the bottom */
    border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden;
  }
  .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #c7d2fe; }
  .card h2 { margin: 12px 16px 4px; font-size: 1.1rem; }
  .card p { margin: 0 16px; color: #475569; }
  .card a { margin: 16px; justify-self: start; padding: 8px 14px; border-radius: 8px; background: #4f46e5; color: white; text-decoration: none; }
</style>
</head>
<body>
  <section class="cards" aria-label="Products">
    <article class="card"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="><h2>Short</h2><p>One line.</p><a href="#">Buy</a></article>
    <article class="card"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="><h2>Longer description</h2><p>This card has a lot more text, so it is taller, but every button in the row still lines up at the bottom of its card.</p><a href="#">Buy</a></article>
    <article class="card"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="><h2>Third</h2><p>Medium amount of text here.</p><a href="#">Buy</a></article>
    <article class="card"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="><h2>Fourth</h2><p>Wraps to the next row when there is no room.</p><a href="#">Buy</a></article>
  </section>
</body>
</html>
