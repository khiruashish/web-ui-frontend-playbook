<header class="top">
  <span class="logo">FreshCart</span>
  <button class="cart-btn" type="button">🛒 Cart <span class="cart-badge">0</span></button>

<main>
  <div class="promo">🎉 Free delivery on your first order with code FRESH50</div>
  <p class="offer" id="offer">Loading today's offer…</p>

  <div class="grid">
    <article class="card" data-price="189">
      <span class="badge">20% OFF</span>
      <div class="media" aria-hidden="true">🍎</div>
      <h2>Shimla Apple</h2>
      <p class="price">₹189</p>
      <button class="add" type="button">ADD</button>
    </article>
    <article class="card" data-price="49">
      <span class="badge">NEW</span>
      <div class="media" aria-hidden="true">🍌</div>
      <h2>Robusta Banana</h2>
      <p class="price">₹49</p>
      <button class="add" type="button">ADD</button>
    </article>
    <article class="card" data-price="68">
      <span class="badge">FRESH</span>
      <div class="media" aria-hidden="true">🥛</div>
      <h2>Full Cream Milk</h2>
      <p class="price">₹68</p>
      <button class="add" type="button">ADD</button>
    </article>
  </div>

  <p class="total">Total: ₹<span id="total">0</span></p>
</main>

<script>
let total = 0;
let count = 0;

document.querySelector(".grid").addEventListener("click", (event) => {
  const button = event.target.closest(".add");
  if (!button) return;
  const card = button.closest(".card");

  // --8<-- [start:fix7]
  total = total + Number(card.dataset.price);                   // FIX 7: data-* values are strings
  // --8<-- [end:fix7]
  document.querySelector("#total").textContent = total;

  count++;
  // --8<-- [start:fix5]
  document.querySelector(".cart-badge").textContent = count;    // FIX 5: the class in the HTML is cart-badge
  // --8<-- [end:fix5]
});

async function loadOffer() {
  const offer = document.querySelector("#offer");
  try {
    // --8<-- [start:fix6]
    const response = await fetch("offers.json");                 // FIX 6: the file is offers.json
    // --8<-- [end:fix6]
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    offer.textContent = `🔥 ${data.title}`;
  } catch (err) {
    offer.textContent = `Couldn't load today's offer (${err.message})`;
  }
}
loadOffer();
</script>
